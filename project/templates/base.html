<!doctype html>
<html>

<head>
    <title>{% block title %}Fundraising App{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    
    {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}
    <p class="flash">{{ m }}</p>
    {% endfor %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>

</body>

</html>
