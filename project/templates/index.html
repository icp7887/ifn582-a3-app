{% extends 'base.html' %}

{% block title %}Campaigns{% endblock %}

{% block content %}

<h1>Campaigns</h1>

<ul>
    {% for campaign in campaigns %}
        <li>
            <strong>{{ campaign.title }}</strong>
            - Goal: ${{ campaign.goalAmount }}
            - Status: {{ campaign.status }}
        </li>
    {% endfor %}
</ul>

{% endblock %}
